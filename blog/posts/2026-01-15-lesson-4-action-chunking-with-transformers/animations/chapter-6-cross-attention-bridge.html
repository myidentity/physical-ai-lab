<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross-Attention Bridge - Canvas Navigator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0a1a;
            --cyan: #00D4AA;
            --coral: #e94560;
            --gold: #ffd700;
            --purple: #6C5CE7;
            --text-light: #e4e4e7;
            --text-muted: #9ca3af;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-deep);
            font-family: 'Sora', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            color: var(--text-light);
        }

        .guided-widget {
            width: 1200px;
            height: 700px;
            max-width: 1200px;
            max-height: 100vh;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            background: var(--bg-deep);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .canvas-area {
            width: 45%;
            flex: 0 0 45%;
            position: relative;
            min-width: 0;
            background: var(--bg-deep);
        }

        .content-panel {
            width: 45%;
            flex: 0 0 45%;
            background: rgba(20, 20, 40, 0.95);
            border-left: 1px solid rgba(99, 102, 241, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .nav-strip {
            flex: 0 0 10%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(15, 15, 35, 0.95);
            border-left: 1px solid rgba(99, 102, 241, 0.2);
            padding: 10px;
        }

        .canvas-controls {
            position: absolute;
            bottom: 12px;
            left: 12px;
            display: flex;
            gap: 8px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .canvas-area:hover .canvas-controls { opacity: 1; }

        .object-tooltip {
            position: absolute;
            background: rgba(20, 20, 40, 0.95);
            border: 1px solid var(--cyan);
            border-radius: 6px;
            padding: 6px 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--cyan);
            pointer-events: none;
            z-index: 1000;
            display: none;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(0, 212, 170, 0.2);
        }

        .canvas-controls button {
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: var(--text-light);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s;
        }

        .canvas-controls button:hover {
            background: rgba(99, 102, 241, 0.4);
        }

        .narrative-header {
            padding: 20px;
            border-bottom: 1px solid rgba(99, 102, 241, 0.2);
        }

        .narrative-header h2 {
            font-size: 18px;
            color: var(--cyan);
            margin-bottom: 8px;
        }

        .section-title { font-size: 14px; color: var(--text-muted); }

        .narrative-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .narrative-content h3 {
            font-size: 16px;
            color: var(--gold);
            margin-bottom: 12px;
        }

        .narrative-content p {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-light);
            margin-bottom: 16px;
        }

        .narrative-content .key-point {
            background: rgba(99, 102, 241, 0.15);
            border-left: 3px solid var(--purple);
            padding: 12px 16px;
            margin: 16px 0;
            border-radius: 0 8px 8px 0;
        }

        .narrative-content .key-point strong { color: var(--cyan); }

        .section-indicator {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 16px;
            border-top: 1px solid rgba(99, 102, 241, 0.2);
        }

        .section-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s;
        }

        .section-dot:hover { background: rgba(255, 255, 255, 0.4); }

        .section-dot.active {
            background: var(--cyan);
            border-color: var(--cyan);
            box-shadow: 0 0 10px var(--cyan);
        }

        .section-dot[data-section="1"],
        .section-dot[data-section="2"] { --dot-color: var(--cyan); }
        .section-dot[data-section="3"],
        .section-dot[data-section="4"] { --dot-color: var(--coral); }
        .section-dot[data-section="5"] { --dot-color: var(--gold); }

        .section-dot[data-section].active {
            background: var(--dot-color);
            border-color: var(--dot-color);
            box-shadow: 0 0 10px var(--dot-color);
        }

        .nav-controls {
            display: flex;
            gap: 12px;
            padding: 16px 20px;
            border-top: 1px solid rgba(99, 102, 241, 0.2);
        }

        .nav-btn {
            flex: 1;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: var(--text-light);
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(99, 102, 241, 0.4);
            border-color: rgba(99, 102, 241, 0.6);
        }

        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .loading {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-deep);
            z-index: 1000;
        }

        .loading-spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(0, 212, 170, 0.3);
            border-top-color: var(--cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .emotion-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .emotion-mystery { background: rgba(108, 92, 231, 0.2); color: var(--purple); }
        .emotion-curiosity { background: rgba(0, 212, 170, 0.2); color: var(--cyan); }
        .emotion-eureka { background: rgba(233, 69, 96, 0.2); color: var(--coral); }
        .emotion-clarity { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .emotion-triumph { background: rgba(255, 215, 0, 0.2); color: var(--gold); }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <div>Loading Cross-Attention Bridge Animation...</div>
    </div>

    <div class="guided-widget main-container">
        <div id="canvas-container" class="canvas-area">
            <div class="canvas-controls">
                <button id="reset-view-btn">Reset View</button>
                <button id="reset-animation-btn">Reset Animation</button>
            </div>
            <div id="object-tooltip" class="object-tooltip"></div>
        </div>

        <div class="narrative-panel content-panel">
            <div class="narrative-header">
                <h2>Cross-Attention Bridge</h2>
                <div class="section-title" id="section-title">Section 1 of 5</div>
            </div>

            <div class="narrative-content" id="narrative-content"></div>

            <div class="section-indicator">
                <div class="section-dot active" data-section="1" title="Encoder Knowledge"></div>
                <div class="section-dot" data-section="2" title="Queries Arrive"></div>
                <div class="section-dot" data-section="3" title="Attention Lines"></div>
                <div class="section-dot" data-section="4" title="Knowledge Flows"></div>
                <div class="section-dot" data-section="5" title="Punchline"></div>
            </div>

            <div class="nav-controls">
                <button class="nav-btn" id="prev-btn" disabled>← Previous</button>
                <button class="nav-btn" id="next-btn">Next →</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TrackballControls.js"></script>

    <script>
        // ========================================
        // NARRATIVE CONTENT FOR EACH SECTION
        // ========================================
        const narrativeContent = {
            1: {
                title: "Encoder Knowledge Floating",
                emotion: "mystery",
                emotionLabel: "🔮 Mystery",
                content: `
                    <p>In the encoder's memory, <strong>1202 librarians</strong> float in timeless suspension.</p>
                    <div class="key-point">
                        <strong>Each orb holds two treasures:</strong><br>
                        • A <span style="color:#e94560">Key</span> (magenta ring) — "This is what I know about"<br>
                        • A <span style="color:#ffd700">Value</span> (gold ring) — "This is the knowledge itself"
                    </div>
                    <p>Watch the 80 encoder orbs drift gently. Four modalities are represented:</p>
                    <p>• <span style="color:#00D4AA">LiDAR</span> • <span style="color:#e94560">RGB</span> • <span style="color:#ffd700">IMU</span> • <span style="color:#6C5CE7">Proprio</span></p>
                    <p><em>They've processed the scene. Now they wait for questions...</em></p>
                `
            },
            2: {
                title: "Queries Arrive",
                emotion: "curiosity",
                emotionLabel: "🎯 Curiosity",
                content: `
                    <p>From the decoder, <strong>6 questions emerge</strong>—each seeking answers for a different timestep.</p>
                    <div class="key-point">
                        <strong>Q1-Q6:</strong> Learnable queries, like DETR's object queries.<br>
                        Each one asks: <em>"What should I do at timestep t?"</em>
                    </div>
                    <p>The queries (cyan orbs below) don't know the answer yet. They only know how to <strong>ask the right questions</strong>.</p>
                    <p>Notice the dashed boundary separating:</p>
                    <p>• <span style="color:#00D4AA">ENCODER</span> (top) — holds Keys and Values<br>
                    • <span style="color:#ffd700">DECODER</span> (bottom) — generates Queries</p>
                    <p><em>The bridge between them is about to form...</em></p>
                `
            },
            3: {
                title: "Attention Lines Form",
                emotion: "eureka",
                emotionLabel: "💡 Eureka",
                content: `
                    <p>Each query <strong>broadcasts simultaneously to all keys</strong>. The attention mechanism asks: "How relevant is each key to my question?"</p>
                    <div class="key-point">
                        <strong>Attention = softmax(QK<sup>T</sup>/√d)</strong><br>
                        Thick lines = high relevance<br>
                        Thin lines = low relevance
                    </div>
                    <p>Watch the attention matrix form on the right. Each cell shows how much Query N attends to Key M.</p>
                    <p>The formula normalizes across all 1202 keys—so attention weights sum to 1.0 for each query.</p>
                    <p><em>This is "voting on relevance"—the queries finding their answers in the encoder's memory.</em></p>
                `
            },
            4: {
                title: "Knowledge Flows",
                emotion: "clarity",
                emotionLabel: "✨ Clarity",
                content: `
                    <p>Attention determined <strong>where to look</strong>. Now Values flow back along those weighted paths.</p>
                    <div class="key-point">
                        <strong>Output = Attention × Values</strong><br>
                        High-attention values contribute more.<br>
                        Low-attention values contribute less.
                    </div>
                    <p>Watch the gold particles (Values) stream toward the query orbs. As they arrive, queries transform into <strong>answers</strong> (A1-A6).</p>
                    <p>The answer isn't a single Value—it's a <strong>weighted blend</strong> of all relevant Values from the encoder.</p>
                    <p><em>The queries asked. The keys matched. The values delivered.</em></p>
                `
            },
            5: {
                title: "Q asks. K answers. V delivers.",
                emotion: "triumph",
                emotionLabel: "🏆 Triumph",
                content: `
                    <div class="key-point" style="text-align:center;font-size:24px;padding:20px;">
                        <span style="color:#00D4AA">Q asks.</span><br>
                        <span style="color:#e94560">K answers.</span><br>
                        <span style="color:#ffd700">V delivers.</span>
                    </div>
                    <p style="text-align:center;margin-top:16px;font-style:italic;color:var(--text-muted)">
                        "Four eyes see different parts of the elephant.<br>
                        The transformer asks the right questions to see the whole."
                    </p>
                    <div class="key-point" style="margin-top:20px;">
                        <strong>Cross-Attention Bridge:</strong><br>
                        6 queries × 1202 keys = understanding<br><br>
                        The decoder doesn't reinvent perception.<br>
                        It <em>queries</em> the encoder's wisdom.
                    </div>
                `
            }
        };

        // ========================================
        // STATE
        // ========================================
        const state = {
            currentSection: 1,
            totalSections: 5,
            scene: null,
            camera: null,
            renderer: null,
            controls: null,
            animationId: null,
            currentObjects: [],
            currentOverlays: []
        };

        // ========================================
        // DOM REFERENCES
        // ========================================
        const container = document.getElementById('canvas-container');
        const loadingEl = document.getElementById('loading');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const resetViewBtn = document.getElementById('reset-view-btn');
        const resetAnimationBtn = document.getElementById('reset-animation-btn');
        const sectionDots = document.querySelectorAll('.section-dot');
        const narrativeEl = document.getElementById('narrative-content');
        const sectionTitleEl = document.getElementById('section-title');
        const tooltipEl = document.getElementById('object-tooltip');

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // ========================================
        // THREE.JS SETUP
        // ========================================
        function initThreeJS() {
            const width = container.clientWidth;
            const height = container.clientHeight;

            state.scene = new THREE.Scene();
            state.scene.background = new THREE.Color(0x0a0a1a);

            state.camera = new THREE.PerspectiveCamera(55, width / height, 0.1, 1000);
            state.camera.position.set(0, 2, 14);
            window.currentCamera = state.camera;
            window.initialCameraPosition = state.camera.position.clone();

            state.renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            state.renderer.setSize(width, height);
            state.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(state.renderer.domElement);

            state.controls = new THREE.TrackballControls(state.camera, state.renderer.domElement);
            state.controls.rotateSpeed = 2.0;
            state.controls.zoomSpeed = 1.2;
            state.controls.panSpeed = 0.8;
            state.controls.dynamicDampingFactor = 0.15;
            window.currentControls = state.controls;

            window.addEventListener('resize', onResize);

            container.addEventListener('mousemove', (e) => {
                const rect = container.getBoundingClientRect();
                mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, state.camera);
                const intersects = raycaster.intersectObjects(state.scene.children, true);

                if (intersects.length > 0 && intersects[0].object.name) {
                    tooltipEl.textContent = intersects[0].object.name;
                    tooltipEl.style.left = (e.clientX - rect.left + 12) + 'px';
                    tooltipEl.style.top = (e.clientY - rect.top - 28) + 'px';
                    tooltipEl.style.display = 'block';
                } else {
                    tooltipEl.style.display = 'none';
                }
            });

            container.addEventListener('mouseleave', () => {
                tooltipEl.style.display = 'none';
            });
        }

        function onResize() {
            const width = container.clientWidth;
            const height = container.clientHeight;
            state.camera.aspect = width / height;
            state.camera.updateProjectionMatrix();
            state.renderer.setSize(width, height);
        }

        // ========================================
        // SCENE CLEANUP
        // ========================================
        function clearScene() {
            if (state.animationId) {
                cancelAnimationFrame(state.animationId);
                state.animationId = null;
            }

            while (state.scene.children.length > 0) {
                const obj = state.scene.children[0];
                state.scene.remove(obj);
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                    if (Array.isArray(obj.material)) {
                        obj.material.forEach(m => m.dispose());
                    } else {
                        obj.material.dispose();
                    }
                }
            }

            state.currentOverlays.forEach(el => el.remove());
            state.currentOverlays = [];
        }


        // ========================================
        // SECTION 1
        // ========================================
        function loadSection1() {
            const scene = state.scene;
            const camera = state.camera;
            
            camera.position.set(0, 2, 14);
            window.initialCameraPosition = camera.position.clone();
            
// Lighting
const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
scene.add(ambientLight);

const pointLight1 = new THREE.PointLight(0x00D4AA, 1, 50);
pointLight1.position.set(5, 5, 5);
scene.add(pointLight1);

const pointLight2 = new THREE.PointLight(0xe94560, 0.8, 50);
pointLight2.position.set(-5, 3, -3);
scene.add(pointLight2);

const pointLight3 = new THREE.PointLight(0xffd700, 0.6, 50);
pointLight3.position.set(0, -2, 5);
scene.add(pointLight3);

// Modality colors
const modalityColors = {
    LiDAR: 0x00D4AA,
    RGB: 0xe94560,
    IMU: 0xffd700,
    Proprio: 0x6C5CE7
};

// Create orbs array
const orbs = [];
const orbGroups = [];

// Distribution: 25 LiDAR, 25 RGB, 15 IMU, 15 Proprio = 80 total
const distribution = [
    ...Array(25).fill('LiDAR'),
    ...Array(25).fill('RGB'),
    ...Array(15).fill('IMU'),
    ...Array(15).fill('Proprio')
];

// Shuffle distribution
for (let i = distribution.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [distribution[i], distribution[j]] = [distribution[j], distribution[i]];
}

// Create each orb with three concentric layers
distribution.forEach((modality, index) => {
    const group = new THREE.Group();
    
    // Random position in upper region
    const x = (Math.random() - 0.5) * 12; // -6 to 6
    const y = Math.random() * 4; // 0 to 4
    const z = (Math.random() - 0.5) * 6; // -3 to 3
    group.position.set(x, y, z);
    
    // Outer ring (Key - magenta)
    const outerRingGeo = new THREE.TorusGeometry(0.35, 0.02, 8, 32);
    const outerRingMat = new THREE.MeshStandardMaterial({
        color: 0xe94560,
        transparent: true,
        opacity: 0.3,
        emissive: 0xe94560,
        emissiveIntensity: 0.3
    });
    const outerRing = new THREE.Mesh(outerRingGeo, outerRingMat);
    outerRing.rotation.x = Math.PI / 2;
    group.add(outerRing);
    
    // Middle ring (Value - gold)
    const middleRingGeo = new THREE.TorusGeometry(0.25, 0.02, 8, 32);
    const middleRingMat = new THREE.MeshStandardMaterial({
        color: 0xffd700,
        transparent: true,
        opacity: 0.5,
        emissive: 0xffd700,
        emissiveIntensity: 0.4
    });
    const middleRing = new THREE.Mesh(middleRingGeo, middleRingMat);
    middleRing.rotation.x = Math.PI / 2;
    middleRing.rotation.y = Math.PI / 4;
    group.add(middleRing);
    
    // Core sphere (modality color)
    const coreGeo = new THREE.SphereGeometry(0.15, 16, 16);
    const coreMat = new THREE.MeshStandardMaterial({
        color: modalityColors[modality],
        emissive: modalityColors[modality],
        emissiveIntensity: 0.5
    });
    const core = new THREE.Mesh(coreGeo, coreMat);
    core.name = `Key-Value Token #${index + 1} (${modality})`;
    group.add(core);
    
    // Store reference for animation
    orbs.push({
        group,
        outerRing,
        middleRing,
        core,
        baseY: y,
        baseX: x,
        index
    });
    
    orbGroups.push(group);
    scene.add(group);
});

// Encoder region boundary (dashed rectangle)
const boundaryPoints = [
    new THREE.Vector3(-7, -1, 0),
    new THREE.Vector3(7, -1, 0),
    new THREE.Vector3(7, 5, 0),
    new THREE.Vector3(-7, 5, 0),
    new THREE.Vector3(-7, -1, 0)
];
const boundaryGeo = new THREE.BufferGeometry().setFromPoints(boundaryPoints);
const boundaryMat = new THREE.LineDashedMaterial({
    color: 0x00D4AA,
    transparent: true,
    opacity: 0.3,
    dashSize: 0.3,
    gapSize: 0.15
});
const boundary = new THREE.Line(boundaryGeo, boundaryMat);
boundary.computeLineDistances();
boundary.name = "Encoder Region Boundary";
scene.add(boundary);

// Subtle grid
const grid = new THREE.GridHelper(20, 20, 0x1a1a3a, 0x1a1a3a);
grid.position.y = -3;
grid.material.transparent = true;
grid.material.opacity = 0.2;
scene.add(grid);

// HTML Overlay
const overlay = document.createElement('div');
overlay.id = 'scene-labels';
overlay.style.cssText = `
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    font-family: 'Courier New', monospace;
`;
container.style.position = 'relative';
container.appendChild(overlay);
state.currentOverlays.push(overlay);

// Label: Top left
const labelEncoder = document.createElement('div');
labelEncoder.style.cssText = `
    position: absolute;
    top: 8%;
    left: 5%;
    color: #00D4AA;
    font-size: 11px;
    text-shadow: 0 0 10px rgba(0, 212, 170, 0.5);
`;
labelEncoder.textContent = 'ENCODER (Vision)';
overlay.appendChild(labelEncoder);

// Label: Top center
const labelKeys = document.createElement('div');
labelKeys.style.cssText = `
    position: absolute;
    top: 3%;
    left: 50%;
    transform: translateX(-50%);
    color: #ffffff;
    font-size: 16px;
    font-weight: bold;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
`;
labelKeys.textContent = '1202 KEYS & VALUES';
overlay.appendChild(labelKeys);

// Label: Bottom center
const labelExplain = document.createElement('div');
labelExplain.style.cssText = `
    position: absolute;
    bottom: 15%;
    left: 50%;
    transform: translateX(-50%);
    color: #888888;
    font-size: 12px;
    text-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
`;
labelExplain.textContent = 'Each orb: Key (magenta ring) + Value (gold ring)';
overlay.appendChild(labelExplain);

// Metaphor box
const metaphorBox = document.createElement('div');
metaphorBox.style.cssText = `
    position: absolute;
    bottom: 5%;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(13, 13, 36, 0.9);
    border: 1px solid #00D4AA;
    border-radius: 15px;
    padding: 12px 20px;
    color: #ffffff;
    font-size: 13px;
    text-shadow: 0 0 5px rgba(0, 212, 170, 0.3);
`;

// Generate attention weights for each query
const attentionWeights = [];
for (let q = 0; q < 6; q++) {
    const weights = [];
    for (let k = 0; k < 80; k++) {
        weights.push(Math.random());
    }
    // Normalize with softmax-like effect
    const sum = weights.reduce((a, b) => a + b, 0);
    for (let k = 0; k < 80; k++) {
        weights[k] = weights[k] / sum;
    }
    attentionWeights.push(weights);
}

// Create lines from each query to top 12 encoder orbs
for (let q = 0; q < 6; q++) {
    const queryPos = queryPositions[q];
    
    // Get top 12 keys by attention weight
    const indexed = attentionWeights[q].map((w, i) => ({ weight: w, index: i }));
    indexed.sort((a, b) => b.weight - a.weight);
    const topKeys = indexed.slice(0, 12);
    
    topKeys.forEach((keyData, lineIdx) => {
        const keyPos = encoderPositions[keyData.index];
        const weight = keyData.weight * 15; // Scale for visibility
        
        // Create curved line using CatmullRomCurve3
        const midPoint = new THREE.Vector3(
            (queryPos.x + keyPos.x) / 2 + (Math.random() - 0.5) * 0.5,
            (queryPos.y + keyPos.y) / 2,
            1 + weight * 0.5
        );
        
        const curve = new THREE.CatmullRomCurve3([
            queryPos.clone(),
            midPoint,
            keyPos.clone()
        ]);
        
        const points = curve.getPoints(30);
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const material = new THREE.LineBasicMaterial({
            color: 0x00D4AA,
            transparent: true,
            opacity: 0.1 + weight * 0.5,
            linewidth: 0.5 + weight * 1.5
        });
        
        const line = new THREE.Line(geometry, material);
        line.name = `Attention Q${q + 1}→K${keyData.index + 1}: ${(weight * 6.67).toFixed(2)}%`;
        line.userData.queryIndex = q;
        line.userData.keyIndex = keyData.index;
        line.userData.weight = weight;
        line.userData.curve = curve;
        line.userData.baseOpacity = material.opacity;
        line.userData.lineOffset = lineIdx;
        
        lineGroup.add(line);
        attentionLines.push(line);
        
        // Update encoder orb to glow brighter based on attention
        encoderOrbs[keyData.index].userData.baseEmissive = Math.min(0.9, encoderOrbs[keyData.index].userData.baseEmissive + weight * 0.3);
        
        // Create particles along line
        if (weight > 0.3) {
            const particleGeom = new THREE.SphereGeometry(0.08, 8, 8);
            const particleMat = new THREE.MeshBasicMaterial({
                color: 0x00D4AA,
                transparent: true,

            });

            particle.userData.curve = curve;
            particle.userData.offset = Math.random();
            particle.userData.speed = 0.3 + weight * 0.2;
            particle.name = `Weight particle Q${q + 1}→K${keyData.index + 1}`;
            scene.add(particle);
            attentionParticles.push(particle);
        }
    });

function triggerAbsorption(answerIdx) {

        color: 0xffd700,
        transparent: true,

    });
    const ring = new THREE.Mesh(ringGeo.clone(), ringMat);
    ring.position.copy(answerPositions[answerIdx]);
    ring.rotation.x = -Math.PI / 2;
    scene.add(ring);
    absorptionRings.push({
        mesh: ring,
        startTime: time,
        duration: 0.5
    });
}

function animate() {
    state.animationId = requestAnimationFrame(animate);
    time += 0.016;
    state.controls.update();
    
    // Animate particles
    particles.forEach((p, idx) => {
        const t = ((time * p.speed + p.offset) % 1);
        const pos = p.curve.getPoint(t);
        p.mesh.position.copy(pos);
        p.mesh.scale.setScalar(0.6 + Math.sin(t * Math.PI) * 0.3);
        p.mesh.material.opacity = Math.sin(t * Math.PI) * 0.9;
        
        // Trigger absorption when particle reaches end
        if (t > 0.95 && t < 0.97) {
            triggerAbsorption(p.answerIdx);
        }
    });
    
    // Animate absorption rings
    absorptionRings.forEach((ring, idx) => {
        const elapsed = time - ring.startTime;
        const progress = elapsed / ring.duration;
        
        if (progress < 1) {
            const scale = 0.5 + progress * 2;
            ring.mesh.scale.set(scale, scale, scale);
            ring.mesh.material.opacity = 0.8 * (1 - progress);
        } else {
            scene.remove(ring.mesh);
            absorptionRings.splice(idx, 1);
        }
    });
    
    // Pulse answer orbs

        const pulse = 1 + 0.05 * Math.sin(time * 4 + idx * 0.5);

}

        function loadSection(sectionNum) {
            clearScene();

            switch(sectionNum) {
                case 1: loadSection1(); break;
                case 2: loadSection2(); break;
                case 3: loadSection3(); break;
                case 4: loadSection4(); break;
                case 5: loadSection5(); break;
            }

            // Update narrative
            const content = narrativeContent[sectionNum];
            narrativeEl.innerHTML = `
                <span class="emotion-badge emotion-${content.emotion}">${content.emotionLabel}</span>
                <h3>${content.title}</h3>
                ${content.content}
            `;

            // Update section indicator
            sectionTitleEl.textContent = `Section ${sectionNum} of ${state.totalSections}`;
            sectionDots.forEach((dot, i) => {
                dot.classList.toggle('active', i + 1 === sectionNum);
            });

            // Update nav buttons
            prevBtn.disabled = sectionNum === 1;
            nextBtn.disabled = sectionNum === state.totalSections;
        }

        function goToSection(sectionNum) {
            if (sectionNum >= 1 && sectionNum <= state.totalSections) {
                state.currentSection = sectionNum;
                loadSection(sectionNum);
            }
        }

        // ========================================
        // EVENT LISTENERS
        // ========================================
        prevBtn.addEventListener('click', () => goToSection(state.currentSection - 1));
        nextBtn.addEventListener('click', () => goToSection(state.currentSection + 1));

        sectionDots.forEach((dot, i) => {
            dot.addEventListener('click', () => goToSection(i + 1));
        });

        resetViewBtn.addEventListener('click', () => {
            if (window.initialCameraPosition && window.currentCamera) {
                window.currentCamera.position.copy(window.initialCameraPosition);
                window.currentCamera.up.set(0, 1, 0);
                if (window.currentControls) {
                    window.currentControls.target.set(0, 0, 0);
                }
            }
        });

        resetAnimationBtn.addEventListener('click', () => {
            loadSection(state.currentSection);
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') goToSection(state.currentSection + 1);
            if (e.key === 'ArrowLeft') goToSection(state.currentSection - 1);
            if (e.key === 'r' || e.key === 'R') resetViewBtn.click();
            if (e.key === 'a' || e.key === 'A') resetAnimationBtn.click();
        });
