<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 7: ACT Training Loop - Canvas Navigator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0a1a;
            --bg-scene: #1a1a2e;
            --cyan: #00D4AA;
            --coral: #e94560;
            --gold: #ffd700;
            --purple: #9B59B6;
            --blue: #00BFFF;
            --green: #2ECC71;
            --text-light: #e4e4e7;
            --text-muted: #9ca3af;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-deep);
            font-family: 'Sora', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            color: var(--text-light);
        }
        .guided-widget {
            width: 1200px;
            height: 700px;
            max-width: 1200px;
            max-height: 100vh;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            background: var(--bg-deep);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .canvas-area {
            width: 45%;
            flex: 0 0 45%;
            position: relative;
            min-width: 0;
            background: var(--bg-deep);
        }
        .content-panel {
            width: 55%;
            flex: 0 0 55%;
            background: rgba(20, 20, 40, 0.95);
            border-left: 1px solid rgba(155, 89, 182, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .canvas-controls {
            position: absolute;
            bottom: 12px;
            left: 12px;
            display: flex;
            gap: 8px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .canvas-area:hover .canvas-controls { opacity: 1; }
        .canvas-controls button {
            background: rgba(155, 89, 182, 0.2);
            border: 1px solid rgba(155, 89, 182, 0.4);
            color: var(--text-light);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s;
        }
        .canvas-controls button:hover { background: rgba(155, 89, 182, 0.4); }
        .narrative-header {
            padding: 20px;
            border-bottom: 1px solid rgba(155, 89, 182, 0.2);
        }
        .narrative-header h2 {
            font-size: 18px;
            color: var(--purple);
            margin-bottom: 8px;
        }
        .section-title {
            font-size: 14px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }
        .narrative-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .narrative-content h3 {
            font-size: 16px;
            color: var(--gold);
            margin-bottom: 12px;
        }
        .narrative-content p {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-light);
            margin-bottom: 12px;
        }
        .narrative-content em { color: var(--cyan); font-style: italic; }
        .narrative-content .key-point {
            background: rgba(155, 89, 182, 0.15);
            border-left: 3px solid var(--purple);
            padding: 12px 16px;
            margin: 12px 0;
            border-radius: 0 8px 8px 0;
            font-size: 13px;
        }
        .narrative-content .key-point strong { color: var(--cyan); }
        .narrative-content .punchline {
            background: linear-gradient(135deg, rgba(155, 89, 182, 0.2), rgba(46, 204, 113, 0.2));
            border: 2px solid var(--green);
            padding: 16px;
            margin: 16px 0;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }
        .narrative-content .hint {
            font-size: 11px;
            color: var(--text-muted);
            font-style: italic;
            padding: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
        }
        .section-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid rgba(155, 89, 182, 0.2);
        }
        .section-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s;
        }
        .section-dot:hover { background: rgba(255, 255, 255, 0.4); }
        .section-dot.active {
            background: var(--purple);
            border-color: var(--purple);
            box-shadow: 0 0 10px var(--purple);
        }
        .nav-controls {
            display: flex;
            gap: 12px;
            padding: 12px 20px;
            border-top: 1px solid rgba(155, 89, 182, 0.2);
        }
        .nav-btn {
            flex: 1;
            background: rgba(155, 89, 182, 0.2);
            border: 1px solid rgba(155, 89, 182, 0.4);
            color: var(--text-light);
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .nav-btn:hover:not(:disabled) {
            background: rgba(155, 89, 182, 0.4);
            border-color: rgba(155, 89, 182, 0.6);
        }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .loading {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-deep);
            z-index: 1000;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(155, 89, 182, 0.3);
            border-top-color: var(--purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .emotion-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            margin-bottom: 12px;
        }
        .emotion-curiosity { background: rgba(155, 89, 182, 0.2); color: var(--purple); }
        .emotion-clarity { background: rgba(255, 215, 0, 0.2); color: var(--gold); }
        .emotion-concern { background: rgba(255, 107, 107, 0.2); color: #FF6B6B; }
        .emotion-relief { background: rgba(46, 204, 113, 0.2); color: var(--green); }
        .emotion-triumph { background: rgba(46, 204, 113, 0.25); color: var(--green); }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <div>Loading ACT Training Loop...</div>
    </div>

    <div class="guided-widget main-container">
        <div id="canvas-container" class="canvas-area">
            <div class="canvas-controls">
                <button id="reset-view-btn">Reset View</button>
            </div>
        </div>

        <div class="narrative-panel content-panel">
            <div class="narrative-header">
                <h2>Chapter 7: ACT Training Loop</h2>
                <div class="section-title" id="section-title">Section 1 of 5</div>
            </div>
            <div class="narrative-content" id="narrative-content"></div>
            <div class="section-indicator">
                <div class="section-dot active" data-section="1" title="Training Cycle"></div>
                <div class="section-dot" data-section="2" title="Reconstruction"></div>
                <div class="section-dot" data-section="3" title="Inference Gap"></div>
                <div class="section-dot" data-section="4" title="KL Rescue"></div>
                <div class="section-dot" data-section="5" title="Two Losses"></div>
            </div>
            <div class="nav-controls">
                <button class="nav-btn" id="prev-btn" disabled>← Previous</button>
                <button class="nav-btn" id="next-btn">Next →</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TrackballControls.js"></script>

    <script>
        const CONFIG = { title: 'ACT Training Loop', sectionCount: 5 };

        const narrativeContent = {
            1: {
                title: "The Training Cycle",
                subtitle: "How ACT Learns from Demonstrations",
                emotion: "curiosity",
                emotionLabel: "🤔 Mystery → Curiosity",
                content: `<p><em>"How does ACT learn from human demonstrations?"</em></p>
                    <div class="key-point"><strong>The Flow:</strong> Demo → Encode → Decode → Compare → Learn</div>
                    <p>A circular flow dominates the scene. Watch the SO-ARM101 robot arm at the center as data flows clockwise through the training cycle.</p>
                    <p><strong>Demo Recording:</strong> Human demonstrations are captured as trajectory trails.</p>
                    <p><strong>Encoder:</strong> The neural network compresses the full demo into a compact style vector Z.</p>
                    <p><strong>Decoder:</strong> Z is expanded back into predicted action sequences.</p>
                    <p><strong>Loss Computation:</strong> Measures how close the prediction is to the original demo.</p>
                    <p><strong>Gradient Flow:</strong> Purple particles flow backward, "teaching" the networks to improve.</p>
                    <p class="hint">💡 Hover over any element to see details. Drag to rotate the view.</p>`
            },
            2: {
                title: "Reconstruction Loss",
                subtitle: "The Main Teacher",
                emotion: "clarity",
                emotionLabel: "💡 Focus → Clarity",
                content: `<p><em>"Match the demonstration as closely as possible"</em></p>
                    <div class="key-point"><strong>The Formula:</strong> L<sub>recon</sub> = ||a<sub>pred</sub> - a<sub>demo</sub>||²</div>
                    <p>Two SO-ARM101 trajectories appear: <span style="color:#FFD700">gold for ground truth</span> and <span style="color:#00BFFF">blue for predicted</span>.</p>
                    <p>When overlaid, <strong>error bars</strong> connect corresponding timesteps. Longer bars = bigger errors!</p>
                    <div class="key-point" style="background: rgba(255, 215, 0, 0.15); border-left-color: #FFD700;"><strong>The Scale:</strong> 100 timesteps × 12 joints = <strong>1,200 squared errors</strong></div>
                    <p>This is <strong>THE MAIN TEACHER</strong> - it teaches WHAT to do by penalizing any deviation from the demonstration.</p>
                    <p class="hint">💡 Hover on error bars to see exact values.</p>`
            },
            3: {
                title: "The Inference Gap",
                subtitle: "Houston, We Have a Problem",
                emotion: "concern",
                emotionLabel: "😰 Worry → Problem Recognized",
                content: `<p>Here's the critical problem that reconstruction loss alone cannot solve...</p>
                    <div class="key-point" style="background: rgba(255, 107, 107, 0.2); border-left-color: #FF6B6B;"><strong>The Problem:</strong> Where does Z come from when we don't have a demo?</div>
                    <p><strong style="color:#2ECC71">🟢 TRAINING (Left):</strong> We have the demo! Obs → Demo → Encoder → Z ✓</p>
                    <p><strong style="color:#FF6B6B">🔴 INFERENCE (Right):</strong> Demo is <span style="color:#FF6B6B;font-weight:bold">MISSING!</span> Obs → ??? → Encoder → Z = ????</p>
                    <div class="key-point"><strong>THE INFERENCE GAP:</strong> The encoder can't run without a demo, yet we need Z to decode actions!</div>
                    <p class="hint">💡 Hover on either side to explore the gap. This tension sets up the solution...</p>`
            },
            4: {
                title: "KL Divergence to the Rescue",
                subtitle: "The Second Teacher",
                emotion: "relief",
                emotionLabel: "✨ Relief → Solution Found",
                content: `<p><em>"Stay close to normal - so inference can sample from N(0,1)!"</em></p>
                    <div class="key-point" style="background: rgba(46, 204, 113, 0.2); border-left-color: #2ECC71;"><strong>The Insight:</strong> What if Z was always near a <em>known</em> distribution?</div>
                    <p><strong>BEFORE KL (Left):</strong> Encoder outputs are scattered chaotically.</p>
                    <p><strong>AFTER KL (Right):</strong> Points cluster near the origin, constrained to N(0,1).</p>
                    <p><strong>The Solution:</strong> During inference, simply sample Z ~ N(0,1) - no demo needed!</p>
                    <div class="key-point"><strong>The Formula:</strong> L<sub>KL</sub> = 0.5 × Σ(μ² + σ² - log(σ²) - 1)</div>
                    <p>This is <strong>✨ THE SECOND TEACHER</strong> - it teaches HOW to organize the latent space.</p>`
            },
            5: {
                title: "Two Losses, One Goal",
                subtitle: "The Complete Picture",
                emotion: "triumph",
                emotionLabel: "🎯 Eureka → Understanding",
                content: `<p>Both losses merge into a beautiful balance - two complementary forces.</p>
                    <div class="key-point" style="background: rgba(155, 89, 182, 0.2); border-left-color: #9B59B6;"><strong>Combined Loss:</strong> L<sub>total</sub> = L<sub>recon</sub> + <span style="color:#FF6B6B;font-weight:bold">10</span> × L<sub>KL</sub></div>
                    <p><span style="color:#FFD700">🤖 Reconstruction (Gold)</span> - Weight: 1× - Teaches: <strong>WHAT</strong></p>
                    <p><span style="color:#9B59B6">🔮 KL Divergence (Purple)</span> - Weight: <strong style="color:#FF6B6B">10×</strong> - Teaches: <strong>HOW</strong></p>
                    <div class="key-point" style="background: rgba(46, 204, 113, 0.25); border-left-color: #2ECC71;"><strong>β = 10:</strong> KL weighted 10× higher for well-organized latent space!</div>
                    <div class="punchline"><strong>THE PUNCHLINE:</strong><br>"<span style="color:#FFD700">Reconstruction</span> teaches <strong>WHAT</strong> to do.<br><span style="color:#9B59B6">KL</span> teaches <strong>HOW</strong> to vary it."</div>
                    <p style="text-align:center;color:#2ECC71;font-weight:bold;">🎯 Understanding Achieved!</p>`
            }
        };

        const state = {
            currentSection: 1,
            animationId: null
        };

        const container = document.getElementById('canvas-container');
        const loadingEl = document.getElementById('loading');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const resetViewBtn = document.getElementById('reset-view-btn');
        const sectionDots = document.querySelectorAll('.section-dot');
        const narrativeEl = document.getElementById('narrative-content');
        const sectionTitleEl = document.getElementById('section-title');

        function clearScene() {
            if (state.animationId) {
                cancelAnimationFrame(state.animationId);
                state.animationId = null;
            }
            const canvas = container.querySelector('canvas');
            if (canvas) canvas.remove();
            const overlays = container.querySelectorAll('div:not(.canvas-controls)');
            overlays.forEach(el => { if (!el.classList.contains('canvas-controls')) el.remove(); });
        }

        function loadSection1() {
            const width = container.clientWidth;
            const height = container.clientHeight;
            // Scene setup
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            
            const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
            camera.position.set(0, 0, 12);
            
            const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);
            
            // Controls
            const controls = new THREE.TrackballControls(camera, renderer.domElement);
            controls.rotateSpeed = 2.0;
            controls.zoomSpeed = 1.2;
            controls.panSpeed = 0.8;
            controls.dynamicDampingFactor = 0.15;
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
            mainLight.position.set(5, 5, 10);
            scene.add(mainLight);
            
            const backLight = new THREE.DirectionalLight(0x9B59B6, 0.3);
            backLight.position.set(-5, -5, -10);
            scene.add(backLight);
            
            // Star field
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 500;
            const starPositions = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount * 3; i += 3) {
                starPositions[i] = (Math.random() - 0.5) * 100;
                starPositions[i + 1] = (Math.random() - 0.5) * 100;
                starPositions[i + 2] = (Math.random() - 0.5) * 50 - 20;
            }
            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1, transparent: true, opacity: 0.6 });
            const stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);
            
            // Colors
            const colors = {
                demo: 0xFFD700,
                encode: 0x9B59B6,
                decode: 0x00BFFF,
                loss: 0xFF6B6B,
                update: 0x2ECC71
            };
            
            // Robot arm creation
            function createRobotArm() {
                const armGroup = new THREE.Group();
                armGroup.name = "SO-ARM101 Robot Arm";
                
                // Base
                const baseGeo = new THREE.CylinderGeometry(0.4, 0.5, 0.3, 32);
                const baseMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.7, roughness: 0.3 });
                const base = new THREE.Mesh(baseGeo, baseMat);
                base.name = "Robot Base";
                armGroup.add(base);
                
                // Joint materials
                const jointMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.8, roughness: 0.2 });
                const segmentMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.7, roughness: 0.3 });
                
                // Segments
                const segments = [];
                const joints = [];
                
                // Segment 1
                const joint1 = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), jointMat);
                joint1.position.y = 0.2;
                joint1.name = "Joint 1 - Base Rotation";
                armGroup.add(joint1);
                joints.push(joint1);
                
                const seg1 = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.6, 16), segmentMat);
                seg1.position.y = 0.5;
                seg1.name = "Arm Segment 1";
                armGroup.add(seg1);
                segments.push(seg1);
                
                // Segment 2
                const joint2 = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), jointMat);
                joint2.position.y = 0.85;
                joint2.name = "Joint 2 - Shoulder";
                armGroup.add(joint2);
                joints.push(joint2);
                
                const seg2Group = new THREE.Group();
                seg2Group.position.y = 0.85;
                const seg2 = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.5, 16), segmentMat);
                seg2.position.y = 0.25;
                seg2.name = "Arm Segment 2";
                seg2Group.add(seg2);
                armGroup.add(seg2Group);
                segments.push(seg2Group);
                
                // Segment 3 with gripper
                const joint3 = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), jointMat);
                joint3.position.y = 0.5;
                joint3.name = "Joint 3 - Elbow";
                seg2Group.add(joint3);
                joints.push(joint3);
                
                const seg3Group = new THREE.Group();
                seg3Group.position.y = 0.5;
                const seg3 = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.4, 16), segmentMat);
                seg3.position.y = 0.2;
                seg3.name = "Arm Segment 3";
                seg3Group.add(seg3);
                seg2Group.add(seg3Group);
                segments.push(seg3Group);
                
                // Gripper
                const gripperBase = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.08, 0.1), segmentMat);
                gripperBase.position.y = 0.45;
                gripperBase.name = "Gripper Base";
                seg3Group.add(gripperBase);
                
                const finger1 = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.15, 0.08), jointMat);
                finger1.position.set(-0.05, 0.52, 0);
                finger1.name = "Gripper Finger 1";
                seg3Group.add(finger1);
                
                const finger2 = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.15, 0.08), jointMat);
                finger2.position.set(0.05, 0.52, 0);
                finger2.name = "Gripper Finger 2";
                seg3Group.add(finger2);
                
                armGroup.userData = { segments, joints, seg2Group, seg3Group, finger1, finger2 };
                armGroup.scale.set(0.8, 0.8, 0.8);
                armGroup.position.y = -0.3;
                
                return armGroup;
            }
            
            const robotArm = createRobotArm();
            scene.add(robotArm);
            
            // Create cycle boxes
            const cycleRadius = 4;
            const boxData = [
                { name: 'DEMO', tooltip: 'Record human demonstrations', color: colors.demo, angle: -135 },
                { name: 'ENCODE', tooltip: 'Compress to latent style Z', color: colors.encode, angle: -90 },
                { name: 'DECODE', tooltip: 'Generate action predictions', color: colors.decode, angle: -45 },
                { name: 'LOSS', tooltip: 'Compare prediction to truth', color: colors.loss, angle: 45 },
                { name: 'UPDATE', tooltip: 'Update network weights', color: colors.update, angle: 135 }
            ];
            
            const boxes = [];
            
            function createBox(data) {
                const group = new THREE.Group();
                group.name = data.name + " - " + data.tooltip;
                
                const angle = (data.angle * Math.PI) / 180;
                const x = Math.cos(angle) * cycleRadius;
                const y = Math.sin(angle) * cycleRadius;
                const z = Math.sin(angle * 2) * 0.3;
                
                // Box frame
                const boxGeo = new THREE.BoxGeometry(1.2, 0.8, 0.3);
                const edges = new THREE.EdgesGeometry(boxGeo);
                const lineMat = new THREE.LineBasicMaterial({ color: data.color, linewidth: 2 });
                const wireframe = new THREE.LineSegments(edges, lineMat);
                group.add(wireframe);
                
                // Filled box
                const fillMat = new THREE.MeshStandardMaterial({
                    color: 0x1a1a2e, emissive: 0x1a1a2e, emissiveIntensity: 0.3,
                    transparent: true,
                    opacity: 0.8,
                    emissive: data.color,
                    emissiveIntensity: 0.1
                });
                const fillBox = new THREE.Mesh(boxGeo, fillMat);
                fillBox.name = data.name + " Box - " + data.tooltip;
                group.add(fillBox);
                
                // Icon based on type
                const iconGroup = new THREE.Group();
                const iconMat = new THREE.MeshBasicMaterial({ color: data.color });
                
                if (data.name === 'DEMO') {
                    // Camera icon
                    const camBody = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.2, 0.1), iconMat);
                    const camLens = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.1, 16), iconMat);
                    camLens.rotation.z = Math.PI / 2;
                    camLens.position.x = 0.17;
                    iconGroup.add(camBody);
                    iconGroup.add(camLens);
                } else if (data.name === 'ENCODE') {
                    // Funnel icon
                    const funnel = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.25, 4), iconMat);
                    funnel.rotation.z = Math.PI;
                    iconGroup.add(funnel);
                } else if (data.name === 'DECODE') {
                    // Expansion icon
                    const expand = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.25, 4), iconMat);
                    iconGroup.add(expand);
                } else if (data.name === 'LOSS') {
                    // Comparison icon
                    const bar1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.2, 0.05), iconMat);
                    bar1.position.x = -0.1;
                    const bar2 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.15, 0.05), iconMat);
                    bar2.position.x = 0.1;
                    iconGroup.add(bar1);
                    iconGroup.add(bar2);
                } else if (data.name === 'UPDATE') {
                    // Refresh arrow

                const toCenter = mid.clone().normalize().multiplyScalar(-0.8);

                const dir = new THREE.Vector3().subVectors(end, points[points.length - 3]).normalize();

            camera.lookAt(0, 0, 0);
            
            const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(width, height);
            container.appendChild(renderer.domElement);
            
            // Controls
            const controls = new THREE.TrackballControls(camera, renderer.domElement);
            controls.rotateSpeed = 2.0;
            controls.zoomSpeed = 1.2;
            controls.panSpeed = 0.8;
            controls.dynamicDampingFactor = 0.15;
            
            // Lighting

            labelsContainer.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;font-family:Arial,sans-serif;';
            container.appendChild(labelsContainer);
            
            // Title
            const title = document.createElement('div');
            title.innerHTML = '🎯 TWO LOSSES, ONE GOAL';
            title.style.cssText = 'position:absolute;top:3%;left:50%;transform:translateX(-50%);font-size:26px;font-weight:700;color:#E8E8E8;text-shadow:0 2px 8px rgba(0,0,0,0.8);';
            labelsContainer.appendChild(title);
            
            // Formula
            const formula = document.createElement('div');
            formula.innerHTML = '<span style="color:#E8E8E8">L</span><sub>total</sub><span style="color:#E8E8E8"> = </span><span style="color:#FFD700">L<sub>recon</sub></span><span style="color:#E8E8E8"> + </span><span style="color:#FF6B6B;font-size:22px;font-weight:700" id="betaNum">10</span><span style="color:#E8E8E8"> × </span><span style="color:#9B59B6">L<sub>KL</sub></span>';
            formula.style.cssText = 'position:absolute;top:10%;left:50%;transform:translateX(-50%);font-size:18px;font-family:monospace;text-shadow:0 2px 8px rgba(0,0,0,0.8);';
            labelsContainer.appendChild(formula);
            
            // Beta callout
            const betaCallout = document.createElement('div');
            betaCallout.textContent = 'β = 10';
            betaCallout.style.cssText = 'position:absolute;top:9%;right:18%;background:rgba(255,107,107,0.3);border:2px solid #FF6B6B;padding:6px 12px;border-radius:20px;font-size:14px;font-weight:700;color:#FF6B6B;';
            labelsContainer.appendChild(betaCallout);
            
            // Recon card labels
            const reconLabels = document.createElement('div');
            reconLabels.innerHTML = '<div style="color:#FFD700;font-size:14px;font-weight:700">RECONSTRUCTION</div><div style="color:#E8E8E8;font-size:12px;margin-top:4px">Teaches: <b>WHAT</b></div><div style="color:#6B7280;font-size:11px;font-style:italic;margin-top:2px">"Copy the demo"</div><div style="color:#FFD700;font-size:11px;margin-top:6px">Weight: 1×</div>';
            reconLabels.style.cssText = 'position:absolute;top:52%;left:12%;text-align:center;text-shadow:0 2px 4px rgba(0,0,0,0.8);';
            labelsContainer.appendChild(reconLabels);
            
            // KL card labels
            const klLabels = document.createElement('div');
            klLabels.innerHTML = '<div style="color:#9B59B6;font-size:14px;font-weight:700">KL DIVERGENCE</div><div style="color:#E8E8E8;font-size:12px;margin-top:4px">Teaches: <b>HOW</b> to vary</div><div style="color:#6B7280;font-size:11px;font-style:italic;margin-top:2px">"Stay organized"</div><div style="color:#9B59B6;font-size:13px;font-weight:700;margin-top:6px">Weight: 10×</div>';
            klLabels.style.cssText = 'position:absolute;top:52%;right:12%;text-align:center;text-shadow:0 2px 4px rgba(0,0,0,0.8);';
            labelsContainer.appendChild(klLabels);
            
            // Punchline
            const punchline = document.createElement('div');
            punchline.innerHTML = 'Reconstruction teaches <span style="color:#FFD700;font-weight:700">WHAT</span> to do.<br>KL teaches <span style="color:#9B59B6;font-weight:700">HOW</span> to vary it.';
            punchline.style.cssText = 'position:absolute;bottom:6%;left:50%;transform:translateX(-50%);font-size:18px;line-height:1.6;text-align:center;color:#E8E8E8;background:rgba(0,0,0,0.5);padding:14px 28px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);text-shadow:0 2px 4px rgba(0,0,0,0.8);';
            labelsContainer.appendChild(punchline);
            
            // Success badge
            const successBadge = document.createElement('div');
            successBadge.innerHTML = '✓ Understanding Achieved!';
            successBadge.style.cssText = 'position:absolute;top:3%;right:3%;background:rgba(46,204,113,0.2);border:2px solid #2ECC71;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;color:#2ECC71;';
            labelsContainer.appendChild(successBadge);
            
            // Weight labels
            const weightLabels = document.createElement('div');
            weightLabels.innerHTML = '<span style="color:#FFD700">1×</span>&nbsp;&nbsp;&nbsp;<span style="color:#9B59B6">10×</span>';
            weightLabels.style.cssText = 'position:absolute;bottom:22%;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;';
            labelsContainer.appendChild(weightLabels);
            
            // Interactivity
            const interactiveObjects = [yinYangMesh, reconCard.card, klCard.card, reconBar, klBar];
            
            container.addEventListener('mousemove', (event) => {
                const rect = container.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / height) * 2 + 1;
                
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(interactiveObjects);
                
                if (intersects.length > 0) {
                    const obj = intersects[0].object;
                    showTooltip(obj.name, event.clientX - rect.left, event.clientY - rect.top);
                    container.style.cursor = 'pointer';
                    
                    if (obj.material && obj.material.emissiveIntensity !== undefined) {
                        obj.material.emissiveIntensity = 0.5;
                    }
                } else {
                    hideTooltip();
                    container.style.cursor = 'grab';
                    interactiveObjects.forEach(obj => {
                        if (obj.material && obj.material.emissiveIntensity !== undefined) {
                            obj.material.emissiveIntensity = 0.1;
                        }
                    });
                }
            });
            
            // Animation
            let yinYangSpeed = 0.05;
            
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                
                const time = Date.now() * 0.001;
                
                // Rotate yin-yang
                yinYangGroup.rotation.z = time * yinYangSpeed;
                
                // Glow ring pulse
                glowRing.material.opacity = 0.2 + Math.sin(time * 2) * 0.1;
                
                // Float cards
                reconCard.position.y = reconCard.baseY + Math.sin(time * 0.8) * 0.08;
                klCard.position.y = klCard.baseY + Math.sin(time * 0.8 + 1) * 0.08;
                
                // Pulse beta number
                const betaNum = document.getElementById('betaNum');
                if (betaNum) {
                    const scale = 1 + Math.sin(time * 2) * 0.05;
                    betaNum.style.transform = `scale(${scale})`;
                }
                
                // Celebration particles
                celebrationParticles.forEach((p) => {
                    p.position.y += p.velocity;
                    p.rotation.x += p.rotSpeed;
                    p.rotation.z += p.rotSpeed * 0.5;
                    
                    if (p.position.y > 6) {
                        p.position.y = -5;
                        p.position.x = (Math.random() - 0.5) * 16;
                    }
                });
                
                // Bars subtle pulse
                reconBar.material.emissiveIntensity = 0.3 + Math.sin(time) * 0.1;
                klBar.material.emissiveIntensity = 0.3 + Math.sin(time + 1) * 0.1;
                
                renderer.render(scene, camera);
            }
            
            animate();
            
            // Store references
            container.scene = scene;
            container.camera = camera;
            container.renderer = renderer;
            
            window.resetView = function() {
                camera.position.set(0, 0, 15);
                camera.lookAt(0, 0, 0);
                controls.target.set(0, 0, 0);
            };
            
        }

        function loadSection(sectionNumber) {
            clearScene();
            switch (sectionNumber) {
                case 1: loadSection1(); break;
                case 2: loadSection2(); break;
                case 3: loadSection3(); break;
                case 4: loadSection4(); break;
                case 5: loadSection5(); break;
                default: loadSection1();
            }
            state.currentSection = sectionNumber;
            updateNarrative(sectionNumber);
            updateNavigationUI();
        }

        function updateNarrative(sectionNumber) {
            const content = narrativeContent[sectionNumber];
            if (!content) return;
            narrativeEl.innerHTML = `
                <span class="emotion-badge emotion-${content.emotion}">${content.emotionLabel}</span>
                <h3>${content.title}</h3>
                ${content.content}
            `;
            sectionTitleEl.textContent = `Section ${sectionNumber} of ${CONFIG.sectionCount}`;
        }

        function updateNavigationUI() {
            prevBtn.disabled = state.currentSection <= 1;
            nextBtn.disabled = state.currentSection >= CONFIG.sectionCount;
            sectionDots.forEach((dot, i) => {
                dot.classList.toggle('active', i + 1 === state.currentSection);
            });
        }

        function nextSection() { if (state.currentSection < CONFIG.sectionCount) loadSection(state.currentSection + 1); }
        function prevSection() { if (state.currentSection > 1) loadSection(state.currentSection - 1); }
        function goToSection(n) { if (n >= 1 && n <= CONFIG.sectionCount) loadSection(n); }

        prevBtn.addEventListener('click', prevSection);
        nextBtn.addEventListener('click', nextSection);
        resetViewBtn.addEventListener('click', () => { if (window.resetView) window.resetView(); });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevSection();
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextSection();
            if (e.key === 'r' || e.key === 'R') { if (window.resetView) window.resetView(); }
        });

        sectionDots.forEach((dot, i) => {
            dot.addEventListener('click', () => goToSection(i + 1));
        });

        function init() {
            loadSection(1);
            loadingEl.style.display = 'none';
        }

        init();
    </script>
</body>
</html>
