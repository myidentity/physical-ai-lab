<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GR00T Dual-System Architecture</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        .control-btn {
            position: absolute;
            bottom: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            z-index: 1000;
            backdrop-filter: blur(5px);
            opacity: 0;
            transition: opacity 0.3s ease, background 0.3s ease, border-color 0.3s ease;
        }
        body:hover .control-btn {
            opacity: 1;
        }
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
        }
        #reset-view-btn { right: 20px; }
        #reset-anim-btn { right: 150px; }

        /* Text overlay base styles */
        .text-overlay {
            position: absolute;
            pointer-events: none;
            font-family: Arial, sans-serif;
            text-shadow: 0 0 10px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.6);
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <button id="reset-anim-btn" class="control-btn">⟲ Reset Animation</button>
    <button id="reset-view-btn" class="control-btn">↺ Reset View</button>

    <!-- Three.js libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TrackballControls.js"></script>

    <script>
        const container = document.getElementById('container');
        const width = window.innerWidth;
        const height = window.innerHeight;

        // ============================================
        // ILLUSTRATION CODE FROM DATABASE GOES HERE
        // ============================================
        // GR00T Dual-System Animation v2
// REDESIGNED: Shows RELATABLE EXAMPLES - "Pick up the red cup"
// Demonstrates: Think slow (understand command) → Act fast (120Hz smooth motion)

const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
camera.position.set(0, 0, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(width, height);
renderer.setClearColor(0x0a0a1a, 1);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
directionalLight.position.set(5, 5, 5);
scene.add(directionalLight);

// Colors
const system2Color = 0x00b4d8; // Cyan for VLM (thinking)
const system1Color = 0xe94560; // Coral for Action (doing)
const commandColor = 0xffd700; // Gold for input command
const trajectoryColor = 0x00ff88; // Green for smooth motion
const cupColor = 0xff6b6b; // Red for the cup example

// ========== SYSTEM 2 BOX (VLM - Left side, COMPACT) ==========
const system2Geo = new THREE.BoxGeometry(2.5, 2, 0.4);
const system2Mat = new THREE.MeshPhongMaterial({
    color: system2Color,
    transparent: true,
    opacity: 0.9
});
const system2Box = new THREE.Mesh(system2Geo, system2Mat);
system2Box.position.set(-3, 0, 0);
scene.add(system2Box);

// ========== SYSTEM 1 BOX (Diffusion - Right side, COMPACT) ==========
const system1Geo = new THREE.BoxGeometry(2.5, 2, 0.4);
const system1Mat = new THREE.MeshPhongMaterial({
    color: system1Color,
    transparent: true,
    opacity: 0.9
});
const system1Box = new THREE.Mesh(system1Geo, system1Mat);
system1Box.position.set(3, 0, 0);
scene.add(system1Box);

// ========== CONNECTING ARROW ==========
const arrowGroup = new THREE.Group();
const arrowGeo = new THREE.CylinderGeometry(0.06, 0.06, 2.5, 8);
const arrowMat = new THREE.MeshPhongMaterial({ color: commandColor, transparent: true, opacity: 0 });
const arrowShaft = new THREE.Mesh(arrowGeo, arrowMat);
arrowShaft.rotation.z = Math.PI / 2;
arrowShaft.position.set(0, 0, 0);
arrowGroup.add(arrowShaft);

const arrowHeadGeo = new THREE.ConeGeometry(0.15, 0.3, 8);
const arrowHeadMat = new THREE.MeshPhongMaterial({ color: commandColor, transparent: true, opacity: 0 });
const arrowHead = new THREE.Mesh(arrowHeadGeo, arrowHeadMat);
arrowHead.rotation.z = -Math.PI / 2;
arrowHead.position.set(1.4, 0, 0);
arrowGroup.add(arrowHead);
scene.add(arrowGroup);

// ========== CUP EXAMPLE (3D object) ==========
const cupGroup = new THREE.Group();
// Cup body
const cupBodyGeo = new THREE.CylinderGeometry(0.3, 0.25, 0.6, 16);
const cupBodyMat = new THREE.MeshPhongMaterial({ color: cupColor, transparent: true, opacity: 0 });
const cupBody = new THREE.Mesh(cupBodyGeo, cupBodyMat);
cupGroup.add(cupBody);
// Cup handle
const handleGeo = new THREE.TorusGeometry(0.15, 0.04, 8, 16, Math.PI);
const handleMat = new THREE.MeshPhongMaterial({ color: cupColor, transparent: true, opacity: 0 });
const handle = new THREE.Mesh(handleGeo, handleMat);
handle.position.set(0.35, 0, 0);
handle.rotation.z = Math.PI / 2;
cupGroup.add(handle);
cupGroup.position.set(-6, -1.5, 0);
scene.add(cupGroup);

// ========== ROBOT ARM TRAJECTORY (smooth curve for 120Hz output) ==========
const trajectoryPoints = [];
for (let i = 0; i <= 50; i++) {
    const t = i / 50;
    // Smooth S-curve trajectory from rest to cup
    trajectoryPoints.push(new THREE.Vector3(
        5 + t * 3,  // Move right
        -1 + Math.sin(t * Math.PI) * 1.5,  // Smooth arc
        0
    ));
}
const trajectoryCurve = new THREE.CatmullRomCurve3(trajectoryPoints);
const trajectoryGeo = new THREE.TubeGeometry(trajectoryCurve, 64, 0.08, 8, false);
const trajectoryMat = new THREE.MeshPhongMaterial({
    color: trajectoryColor,
    transparent: true,
    opacity: 0,
    emissive: trajectoryColor,
    emissiveIntensity: 0.2
});
const trajectoryMesh = new THREE.Mesh(trajectoryGeo, trajectoryMat);
scene.add(trajectoryMesh);

// ========== 120Hz OUTPUT PARTICLES ==========
const outputParticles = [];
const numOutputs = 25;
for (let i = 0; i < numOutputs; i++) {
    const particleGeo = new THREE.SphereGeometry(0.1, 12, 12);
    const particleMat = new THREE.MeshPhongMaterial({
        color: trajectoryColor,
        transparent: true,
        opacity: 0,
        emissive: trajectoryColor,
        emissiveIntensity: 0.4
    });
    const particle = new THREE.Mesh(particleGeo, particleMat);
    particle.userData.offset = i / numOutputs;
    outputParticles.push(particle);
    scene.add(particle);
}

// ========== THINKING DOTS (inside System 2) ==========
const thinkingDots = [];
for (let i = 0; i < 5; i++) {
    const dotGeo = new THREE.SphereGeometry(0.12, 12, 12);
    const dotMat = new THREE.MeshPhongMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0,
        emissive: system2Color,
        emissiveIntensity: 0.5
    });
    const dot = new THREE.Mesh(dotGeo, dotMat);
    dot.userData.baseY = -0.6 + i * 0.3;
    thinkingDots.push(dot);
    scene.add(dot);
}

// ========== HTML OVERLAY ==========
const overlay = document.createElement('div');
overlay.style.cssText = `
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    font-family: 'Segoe UI', Arial, sans-serif;
`;
container.appendChild(overlay);

// Phase title
const phaseTitle = document.createElement('div');
phaseTitle.style.cssText = `
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    font-weight: bold;
    color: #00d9ff;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
    white-space: nowrap;
`;
overlay.appendChild(phaseTitle);

// Phase subtitle
const phaseSubtitle = document.createElement('div');
phaseSubtitle.style.cssText = `
    position: absolute;
    top: 35px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: #cccccc;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
    white-space: nowrap;
`;
overlay.appendChild(phaseSubtitle);

// Command bubble (input example)
const commandBubble = document.createElement('div');
commandBubble.style.cssText = `
    position: absolute;
    top: 25%;
    left: 8%;
    background: linear-gradient(135deg, rgba(255,215,0,0.2) 0%, rgba(255,215,0,0.1) 100%);
    border: 2px solid #ffd700;
    border-radius: 12px;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: bold;
    color: #ffd700;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
    opacity: 0;
    white-space: nowrap;
`;
commandBubble.innerHTML = '🎤 "Pick up the red cup"';
overlay.appendChild(commandBubble);

// System 2 label
const system2Label = document.createElement('div');
system2Label.style.cssText = `
    position: absolute;
    bottom: 18%;
    left: 28%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: bold;
    color: #00b4d8;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
    text-align: center;
    line-height: 1.4;
`;
system2Label.innerHTML = 'SYSTEM 2<br><span style="font-size:9px;color:#888;">🧠 Slow Thinking</span>';
overlay.appendChild(system2Label);

// System 1 label
const system1Label = document.createElement('div');
system1Label.style.cssText = `
    position: absolute;
    bottom: 18%;
    left: 72%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: bold;
    color: #e94560;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
    text-align: center;
    line-height: 1.4;
`;
system1Label.innerHTML = 'SYSTEM 1<br><span style="font-size:9px;color:#888;">⚡ Fast Action</span>';
overlay.appendChild(system1Label);

// Thought bubbles (what System 2 understands)
const thoughtBubble = document.createElement('div');
thoughtBubble.style.cssText = `
    position: absolute;
    top: 30%;
    left: 22%;
    font-size: 11px;
    color: #00b4d8;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
    line-height: 1.8;
    opacity: 0;
`;
thoughtBubble.innerHTML = `
    <div>📍 Object: <b>cup</b></div>
    <div>🎨 Color: <b>red</b></div>
    <div>🎯 Action: <b>pick up</b></div>
    <div>📐 Location: <b>(x,y,z)</b></div>
`;
overlay.appendChild(thoughtBubble);

// Understanding arrow label
const understandingLabel = document.createElement('div');
understandingLabel.style.cssText = `
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #ffd700;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
    opacity: 0;
    text-align: center;
`;
understandingLabel.innerHTML = '→ "Grasp cup at position X" →';
overlay.appendChild(understandingLabel);

// Output label (120Hz)
const outputLabel = document.createElement('div');
outputLabel.style.cssText = `
    position: absolute;
    top: 28%;
    right: 5%;
    font-size: 12px;
    font-weight: bold;
    color: #00ff88;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
    opacity: 0;
`;
outputLabel.innerHTML = '120Hz Actions<br><span style="font-size:10px;color:#aaa;">Smooth trajectory</span>';
overlay.appendChild(outputLabel);

// Punchline box
const punchline = document.createElement('div');
punchline.style.cssText = `
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, rgba(0,180,216,0.15) 0%, rgba(233,69,96,0.15) 100%);
    border: 2px solid #ffd700;
    border-radius: 12px;
    padding: 25px 35px;
    text-align: center;
    opacity: 0;
`;
punchline.innerHTML = `
    <div style="font-size: 18px; font-weight: bold; color: #ffd700; margin-bottom: 15px;">
        GR00T: Think Slow, Act Fast
    </div>
    <div style="font-size: 13px; color: #fff; line-height: 2;">
        <span style="color: #ffd700;">🎤</span> "Pick up the red cup"<br>
        <span style="color: #00b4d8;">🧠</span> <b>System 2</b>: Understands WHAT to do<br>
        <span style="font-size:11px;color:#888;margin-left:20px;">→ Parse command, locate object, plan grasp</span><br>
        <span style="color: #e94560;">⚡</span> <b>System 1</b>: Knows HOW to do it smoothly<br>
        <span style="font-size:11px;color:#888;margin-left:20px;">→ 120Hz trajectory = buttery smooth motion</span><br><br>
        <span style="color: #aaa; font-size: 11px;">Inspired by Kahneman's "Thinking Fast and Slow"</span>
    </div>
`;
overlay.appendChild(punchline);

// Animation phases
const phases = [
    { title: "GR00T Architecture", subtitle: "A command arrives...", duration: 3000 },
    { title: "🎤 \"Pick up the red cup\"", subtitle: "Voice command enters the system", duration: 3500 },
    { title: "SYSTEM 2: Understanding", subtitle: "VLM parses what you mean...", duration: 4500 },
    { title: "Understanding → Action Plan", subtitle: "\"Grasp cup at position X\"", duration: 3500 },
    { title: "SYSTEM 1: Smooth Execution", subtitle: "120Hz trajectory generation!", duration: 4500 },
    { title: "Result: Buttery Smooth Motion", subtitle: "Every 8ms, a new action point", duration: 4000 },
    { title: "", subtitle: "", duration: 5500 }
];

let currentPhase = 0;
let phaseStartTime = Date.now();
let animationTime = 0;

function updatePhase() {
    const now = Date.now();
    const elapsed = now - phaseStartTime;

    if (elapsed > phases[currentPhase].duration) {
        currentPhase = (currentPhase + 1) % phases.length;
        phaseStartTime = now;

        if (currentPhase === 0) {
            // Reset for loop
            outputParticles.forEach(p => p.material.opacity = 0);
        }
    }

    const phase = currentPhase;
    const t = elapsed / phases[phase].duration;

    phaseTitle.textContent = phases[phase].title;
    phaseSubtitle.textContent = phases[phase].subtitle;

    // Default visibility
    system2Box.visible = phase < 6;
    system1Box.visible = phase < 6;
    arrowGroup.visible = phase >= 3 && phase < 6;
    cupGroup.visible = phase >= 1 && phase < 6;
    trajectoryMesh.visible = phase >= 4 && phase < 6;

    system2Label.style.opacity = phase < 6 ? '1' : '0';
    system1Label.style.opacity = phase < 6 ? '1' : '0';
    punchline.style.opacity = phase === 6 ? '1' : '0';

    // Reset opacities
    commandBubble.style.opacity = '0';
    thoughtBubble.style.opacity = '0';
    understandingLabel.style.opacity = '0';
    outputLabel.style.opacity = '0';
    cupBodyMat.opacity = 0;
    handleMat.opacity = 0;
    arrowMat.opacity = 0;
    arrowHeadMat.opacity = 0;
    trajectoryMat.opacity = 0;
    thinkingDots.forEach(d => d.material.opacity = 0);
    outputParticles.forEach(p => p.material.opacity = 0);

    // Phase 0: Intro - show architecture
    if (phase === 0) {
        // Just show the boxes
    }

    // Phase 1: Command arrives + cup appears
    if (phase === 1) {
        commandBubble.style.opacity = Math.min(t * 3, 1).toString();
        cupBodyMat.opacity = Math.min(t * 2, 0.9);
        handleMat.opacity = Math.min(t * 2, 0.9);

        // Cup bobs slightly
        cupGroup.position.y = -1.5 + Math.sin(animationTime * 2) * 0.1;
    }

    // Phase 2: System 2 thinking - show thought bubbles
    if (phase === 2) {
        commandBubble.style.opacity = '1';
        cupBodyMat.opacity = 0.9;
        handleMat.opacity = 0.9;

        // System 2 pulses SLOWLY (deliberate thinking)
        system2Mat.emissive.setHex(0x003344);
        system2Box.scale.setScalar(1 + Math.sin(animationTime * 2) * 0.04);

        // Thought bubbles appear one by one
        thoughtBubble.style.opacity = Math.min(t * 2, 1).toString();

        // Thinking dots cascade down inside System 2
        thinkingDots.forEach((dot, i) => {
            const dotDelay = i * 0.15;
            const dotT = Math.max(0, t - dotDelay);
            dot.material.opacity = Math.min(dotT * 3, 0.8);
            dot.position.x = -3;
            dot.position.y = dot.userData.baseY;
            dot.position.z = 0.3;
            // Pulse individually
            dot.scale.setScalar(1 + Math.sin(animationTime * 3 + i) * 0.2);
        });
    } else {
        system2Mat.emissive.setHex(0x000000);
        system2Box.scale.setScalar(1);
    }

    // Phase 3: Understanding flows to System 1
    if (phase === 3) {
        commandBubble.style.opacity = '0.5';
        thoughtBubble.style.opacity = '1';
        cupBodyMat.opacity = 0.9;
        handleMat.opacity = 0.9;

        // Arrow appears and pulses
        arrowMat.opacity = Math.min(t * 2, 0.9);
        arrowHeadMat.opacity = Math.min(t * 2, 0.9);
        understandingLabel.style.opacity = Math.min(t * 2, 1).toString();

        // Particles flow along arrow
        thinkingDots.forEach((dot, i) => {
            const flowT = Math.max(0, (t - 0.2) * 2);
            dot.material.opacity = 0.7 * (1 - flowT);
            dot.position.x = -3 + flowT * 6;  // Move from System 2 to System 1
        });
    }

    // Phase 4: System 1 executes - fast pulses + trajectory
    if (phase === 4) {
        cupBodyMat.opacity = 0.9;
        handleMat.opacity = 0.9;

        // System 1 pulses FAST (rapid execution)
        system1Mat.emissive.setHex(0x331111);
        system1Box.scale.setScalar(1 + Math.sin(animationTime * 6) * 0.03);

        // Trajectory appears
        trajectoryMat.opacity = Math.min(t * 2, 0.8);
        outputLabel.style.opacity = Math.min(t * 2, 1).toString();

        // Output particles stream along trajectory
        outputParticles.forEach((p, i) => {
            const streamT = ((animationTime * 1.5) + p.userData.offset) % 1;
            const point = trajectoryCurve.getPoint(streamT);
            p.position.copy(point);
            p.material.opacity = 0.3 + streamT * 0.5;
        });
    } else {
        system1Mat.emissive.setHex(0x000000);
        system1Box.scale.setScalar(1);
    }

    // Phase 5: Full smooth motion visualization
    if (phase === 5) {
        cupBodyMat.opacity = 0.9;
        handleMat.opacity = 0.9;
        trajectoryMat.opacity = 0.9;
        outputLabel.style.opacity = '1';

        // System 1 continues fast pulse
        system1Mat.emissive.setHex(0x331111);
        system1Box.scale.setScalar(1 + Math.sin(animationTime * 6) * 0.03);

        // Dense particle stream shows 120Hz
        outputParticles.forEach((p, i) => {
            const streamT = ((animationTime * 2) + p.userData.offset) % 1;
            const point = trajectoryCurve.getPoint(streamT);
            p.position.copy(point);
            p.material.opacity = 0.5 + streamT * 0.4;
            // Particles glow brighter
            p.material.emissiveIntensity = 0.3 + streamT * 0.4;
        });
    }

    // Phase 6: Punchline
    if (phase === 6) {
        // Hide everything
        system2Box.visible = false;
        system1Box.visible = false;
        arrowGroup.visible = false;
        cupGroup.visible = false;
        trajectoryMesh.visible = false;
        outputParticles.forEach(p => p.visible = false);
        thinkingDots.forEach(d => d.visible = false);
    } else {
        outputParticles.forEach(p => p.visible = true);
        thinkingDots.forEach(d => d.visible = true);
    }
}

function animate() {
    requestAnimationFrame(animate);
    animationTime += 0.016;
    updatePhase();
    renderer.render(scene, camera);
}

function resetAnimation() {
    currentPhase = 0;
    phaseStartTime = Date.now();
    animationTime = 0;
    outputParticles.forEach(p => {
        p.material.opacity = 0;
    });
}

animate();

        // ============================================
        // END ILLUSTRATION CODE
        // ============================================

        // Reset View button - restore camera position
        const initialCameraPosition = {
            x: camera.position.x,
            y: camera.position.y,
            z: camera.position.z
        };

        document.getElementById('reset-view-btn').addEventListener('click', () => {
            camera.position.set(
                initialCameraPosition.x,
                initialCameraPosition.y,
                initialCameraPosition.z
            );
            camera.up.set(0, 1, 0);
            controls.target.set(0, 0, 0);
            controls.reset();
        });

        // Reset Animation button - restart from phase 1
        // Note: resetAnimation() function must be defined in the illustration code
        document.getElementById('reset-anim-btn').addEventListener('click', () => {
            if (typeof resetAnimation === 'function') {
                resetAnimation();
            } else {
                console.warn('resetAnimation() not defined in illustration code');
            }
        });

        // Window resize handler
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
    </script>
</body>
</html>
