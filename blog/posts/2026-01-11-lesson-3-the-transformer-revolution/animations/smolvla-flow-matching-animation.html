<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmolVLA Flow Matching Animation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        .control-btn {
            position: absolute;
            bottom: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            z-index: 1000;
            backdrop-filter: blur(5px);
            opacity: 0;
            transition: opacity 0.3s ease, background 0.3s ease, border-color 0.3s ease;
        }
        body:hover .control-btn {
            opacity: 1;
        }
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
        }
        #reset-view-btn { right: 20px; }
        #reset-anim-btn { right: 150px; }

        /* Text overlay base styles */
        .text-overlay {
            position: absolute;
            pointer-events: none;
            font-family: Arial, sans-serif;
            text-shadow: 0 0 10px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.6);
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <button id="reset-anim-btn" class="control-btn">⟲ Reset Animation</button>
    <button id="reset-view-btn" class="control-btn">↺ Reset View</button>

    <!-- Three.js libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TrackballControls.js"></script>

    <script>
        const container = document.getElementById('container');
        const width = window.innerWidth;
        const height = window.innerHeight;

        // ============================================
        // ILLUSTRATION CODE FROM DATABASE GOES HERE
        // ============================================
        // SmolVLA Flow Matching Animation v7
// FIXED: Input labels positioned closer, Action Expert doesn't overlap gold arrow

const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
camera.position.set(0, 0, 16);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(width, height);
renderer.setClearColor(0x0a0a1a, 1);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
directionalLight.position.set(5, 5, 5);
scene.add(directionalLight);

// Colors
const vlmColor = 0x00b4d8;
const actionColor = 0xe94560;
const featureColor = 0xffd700;
const noiseColor = 0xff6b6b;
const smoothColor = 0x00ff88;
const arrowColor = 0x4ecdc4;
const cameraColor = 0x4ecdc4;
const textColor = 0xffffff;
const stateColor = 0xff9f43;

// ========== INPUT ICONS (Camera, Text, State) ==========
const inputGroup = new THREE.Group();

// Camera icon (box representing camera)
const cameraGeo = new THREE.BoxGeometry(0.5, 0.35, 0.25);
const cameraMat = new THREE.MeshPhongMaterial({ color: cameraColor, transparent: true, opacity: 0.9 });
const cameraIcon = new THREE.Mesh(cameraGeo, cameraMat);
cameraIcon.position.set(-7.5, 1.2, 0);
inputGroup.add(cameraIcon);

// Camera lens
const lensGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.15, 16);
const lensMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
const lens = new THREE.Mesh(lensGeo, lensMat);
lens.rotation.z = Math.PI / 2;
lens.position.set(-7.15, 1.2, 0);
inputGroup.add(lens);

// Text icon (document shape)
const textGeo = new THREE.BoxGeometry(0.4, 0.5, 0.08);
const textMat = new THREE.MeshPhongMaterial({ color: textColor, transparent: true, opacity: 0.9 });
const textIcon = new THREE.Mesh(textGeo, textMat);
textIcon.position.set(-7.5, 0, 0);
inputGroup.add(textIcon);

// Text lines on document
for (let i = 0; i < 3; i++) {
    const lineGeo = new THREE.BoxGeometry(0.25, 0.04, 0.02);
    const lineMat = new THREE.MeshPhongMaterial({ color: 0x333333 });
    const line = new THREE.Mesh(lineGeo, lineMat);
    line.position.set(-7.5, 0.12 - i * 0.12, 0.05);
    inputGroup.add(line);
}

// Robot state icon (joint/gear)
const stateGeo = new THREE.TorusGeometry(0.2, 0.06, 8, 16);
const stateMat = new THREE.MeshPhongMaterial({ color: stateColor, transparent: true, opacity: 0.9 });
const stateIcon = new THREE.Mesh(stateGeo, stateMat);
stateIcon.position.set(-7.5, -1.2, 0);
inputGroup.add(stateIcon);

// Center dot for gear
const centerGeo = new THREE.SphereGeometry(0.08, 8, 8);
const centerMat = new THREE.MeshPhongMaterial({ color: stateColor });
const centerDot = new THREE.Mesh(centerGeo, centerMat);
centerDot.position.set(-7.5, -1.2, 0);
inputGroup.add(centerDot);

scene.add(inputGroup);

// ========== INPUT ARROWS (flowing to VLM) ==========
const inputArrows = [];
const inputPositions = [1.2, 0, -1.2]; // Y positions for camera, text, state

for (let i = 0; i < 3; i++) {
    const arrowShaftGeo = new THREE.CylinderGeometry(0.04, 0.04, 1.0, 8);
    const arrowShaftMat = new THREE.MeshPhongMaterial({
        color: i === 0 ? cameraColor : (i === 1 ? textColor : stateColor),
        transparent: true, opacity: 0.8
    });
    const arrowShaft = new THREE.Mesh(arrowShaftGeo, arrowShaftMat);
    arrowShaft.rotation.z = Math.PI / 2;
    arrowShaft.position.set(-6.4, inputPositions[i], 0);

    const arrowHeadGeo = new THREE.ConeGeometry(0.1, 0.2, 8);
    const arrowHeadMat = new THREE.MeshPhongMaterial({
        color: i === 0 ? cameraColor : (i === 1 ? textColor : stateColor),
        transparent: true, opacity: 0.8
    });
    const arrowHead = new THREE.Mesh(arrowHeadGeo, arrowHeadMat);
    arrowHead.rotation.z = -Math.PI / 2;
    arrowHead.position.set(-5.8, inputPositions[i], 0);

    const arrowObj = new THREE.Group();
    arrowObj.add(arrowShaft);
    arrowObj.add(arrowHead);
    arrowObj.visible = false;
    inputArrows.push(arrowObj);
    scene.add(arrowObj);
}

// VLM box (left side)
const vlmGeometry = new THREE.BoxGeometry(2.5, 2.2, 0.4);
const vlmMaterial = new THREE.MeshPhongMaterial({ color: vlmColor, transparent: true, opacity: 0.9 });
const vlmBox = new THREE.Mesh(vlmGeometry, vlmMaterial);
vlmBox.position.set(-4.3, 0, 0);
scene.add(vlmBox);

// Action Expert box (moved further right to not overlap arrow)
const actionGeometry = new THREE.BoxGeometry(2.5, 2.2, 0.4);
const actionMaterial = new THREE.MeshPhongMaterial({ color: actionColor, transparent: true, opacity: 0.9 });
const actionBox = new THREE.Mesh(actionGeometry, actionMaterial);
actionBox.position.set(1.5, 0, 0);  // Moved further right (left edge at 0.25)
scene.add(actionBox);

// Feature arrow (VLM -> Action Expert) - SHORTENED to not overlap
const arrowGroup = new THREE.Group();
const arrowGeo = new THREE.CylinderGeometry(0.06, 0.06, 2.0, 8);  // Shorter arrow
const arrowMat = new THREE.MeshPhongMaterial({ color: featureColor });
const arrowShaft = new THREE.Mesh(arrowGeo, arrowMat);
arrowShaft.rotation.z = Math.PI / 2;
arrowShaft.position.set(-2.0, 0, 0);  // Centered between VLM and Action Expert
arrowGroup.add(arrowShaft);

const arrowHeadGeo = new THREE.ConeGeometry(0.15, 0.3, 8);
const arrowHead = new THREE.Mesh(arrowHeadGeo, arrowMat);
arrowHead.rotation.z = -Math.PI / 2;
arrowHead.position.set(-0.85, 0, 0);  // Arrow ends well before Action Expert
arrowGroup.add(arrowHead);
scene.add(arrowGroup);

// ========== NOISE PARTICLES ==========
const noiseParticles = [];
const numParticles = 30;

// Target positions (smooth sine trajectory) - MOVED RIGHT
const trajectoryTargets = [];
for (let i = 0; i < numParticles; i++) {
    const t = i / (numParticles - 1);
    trajectoryTargets.push(new THREE.Vector3(
        4.5 + t * 4,  // Moved further right, slightly shorter span
        Math.sin(t * Math.PI * 2) * 1.2,
        0
    ));
}

for (let i = 0; i < numParticles; i++) {
    const particleGeo = new THREE.SphereGeometry(0.18, 16, 16);
    const particleMat = new THREE.MeshPhongMaterial({
        color: noiseColor,
        transparent: true,
        opacity: 0.9,
        emissive: noiseColor,
        emissiveIntensity: 0.3
    });
    const particle = new THREE.Mesh(particleGeo, particleMat);

    particle.userData.noisePos = new THREE.Vector3(
        4.5 + Math.random() * 4,  // Moved further right
        (Math.random() - 0.5) * 4,
        (Math.random() - 0.5) * 2
    );
    particle.userData.targetPos = trajectoryTargets[i].clone();
    particle.position.copy(particle.userData.noisePos);
    particle.visible = false;

    noiseParticles.push(particle);
    scene.add(particle);
}

// Velocity arrows
const velocityArrows = [];
for (let i = 0; i < 12; i++) {
    const shaft = new THREE.CylinderGeometry(0.03, 0.03, 0.5, 6);
    const head = new THREE.ConeGeometry(0.08, 0.15, 6);

    const shaftMesh = new THREE.Mesh(shaft, new THREE.MeshPhongMaterial({
        color: arrowColor, transparent: true, opacity: 0
    }));
    const headMesh = new THREE.Mesh(head, new THREE.MeshPhongMaterial({
        color: arrowColor, transparent: true, opacity: 0
    }));
    headMesh.position.y = 0.325;

    const arrowObj = new THREE.Group();
    arrowObj.add(shaftMesh);
    arrowObj.add(headMesh);
    arrowObj.position.set(4.5 + Math.random() * 4, (Math.random() - 0.5) * 3, 0);
    arrowObj.visible = false;
    arrowObj.userData.shaftMat = shaftMesh.material;
    arrowObj.userData.headMat = headMesh.material;

    velocityArrows.push(arrowObj);
    scene.add(arrowObj);
}

// Trajectory line
const trajectoryCurve = new THREE.CatmullRomCurve3(trajectoryTargets);
const trajectoryGeo = new THREE.TubeGeometry(trajectoryCurve, 64, 0.1, 8, false);
const trajectoryMat = new THREE.MeshPhongMaterial({
    color: smoothColor, transparent: true, opacity: 0,
    emissive: smoothColor, emissiveIntensity: 0.2
});
const trajectoryMesh = new THREE.Mesh(trajectoryGeo, trajectoryMat);
scene.add(trajectoryMesh);

// ========== HTML OVERLAY ==========
const overlay = document.createElement('div');
overlay.style.cssText = `
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    font-family: 'Segoe UI', Arial, sans-serif;
`;
container.appendChild(overlay);

// Phase title - TOP CENTER
const phaseTitle = document.createElement('div');
phaseTitle.style.cssText = `
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    font-weight: bold;
    color: #00d9ff;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
    white-space: nowrap;
`;
overlay.appendChild(phaseTitle);

// Phase subtitle - BELOW title
const phaseSubtitle = document.createElement('div');
phaseSubtitle.style.cssText = `
    position: absolute;
    top: 35px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: #cccccc;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
    white-space: nowrap;
`;
overlay.appendChild(phaseSubtitle);

// Input labels (Camera, Text, State) - MOVED CLOSER to icons
const inputLabels = document.createElement('div');
inputLabels.style.cssText = `
    position: absolute;
    left: 20%;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    color: #888;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
    line-height: 2.8;
    text-align: right;
`;
inputLabels.innerHTML = `
    <span style="color:#4ecdc4;">📷 Camera</span><br>
    <span style="color:#fff;">📝 Text</span><br>
    <span style="color:#ff9f43;">🤖 State</span>
`;
overlay.appendChild(inputLabels);

// VLM label with SigLIP + SmolLM2
const vlmLabel = document.createElement('div');
vlmLabel.style.cssText = `
    position: absolute;
    bottom: 12%;
    left: 30%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: bold;
    color: #00b4d8;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
    text-align: center;
    line-height: 1.4;
`;
vlmLabel.innerHTML = 'VLM<br><span style="font-size:9px;color:#aaa;">SigLIP + SmolLM2</span>';
overlay.appendChild(vlmLabel);

// Action Expert label with Flow Matching - moved further right
const actionLabel = document.createElement('div');
actionLabel.style.cssText = `
    position: absolute;
    bottom: 12%;
    left: 58%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: bold;
    color: #e94560;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
    text-align: center;
    line-height: 1.4;
`;
actionLabel.innerHTML = 'ACTION EXPERT<br><span style="font-size:9px;color:#aaa;">Flow Matching</span>';
overlay.appendChild(actionLabel);

// Status label - MOVED UP closer to particles
const statusLabel = document.createElement('div');
statusLabel.style.cssText = `
    position: absolute;
    bottom: 35%;
    left: 78%;
    transform: translateX(-50%);
    font-size: 14px;
    font-weight: bold;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
    text-align: center;
`;
overlay.appendChild(statusLabel);

// Punchline
const punchline = document.createElement('div');
punchline.style.cssText = `
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, rgba(233,69,96,0.2) 0%, rgba(0,180,216,0.2) 100%);
    border: 2px solid #ffd700;
    border-radius: 12px;
    padding: 20px 30px;
    text-align: center;
    opacity: 0;
`;
punchline.innerHTML = `
    <div style="font-size: 18px; font-weight: bold; color: #ffd700; margin-bottom: 10px;">
        SmolVLA: Flow Matching
    </div>
    <div style="font-size: 12px; color: #fff; line-height: 1.8;">
        <span style="color: #00b4d8;">■</span> <b>VLM</b> (SigLIP + SmolLM2) builds features from:<br>
        <span style="margin-left:20px;color:#4ecdc4;">📷</span> Camera images + <span style="color:#fff;">📝</span> Text + <span style="color:#ff9f43;">🤖</span> Robot state<br><br>
        <span style="color: #e94560;">■</span> <b>Action Expert</b> uses flow matching:<br>
        <span style="color: #ff6b6b;">●</span> Start with random noise for ALL timesteps<br>
        <span style="color: #4ecdc4;">➜</span> Velocity field guides particles together<br>
        <span style="color: #00ff88;">●</span> Result: <b>Smooth trajectory</b> at once!
    </div>
`;
overlay.appendChild(punchline);

// Animation phases
const phases = [
    { title: "SmolVLA Architecture", subtitle: "Two stages: Understanding → Action", duration: 3000 },
    { title: "Stage 1: VLM (SigLIP + SmolLM2)", subtitle: "Camera + Text + Robot State → Rich Features", duration: 4000 },
    { title: "Stage 2: Action Expert", subtitle: "Features → Smooth Action Trajectories", duration: 3000 },
    { title: "FLOW MATCHING", subtitle: "Step 1: Start with RANDOM NOISE", duration: 4000 },
    { title: "FLOW MATCHING", subtitle: "Step 2: Velocity field guides particles", duration: 4500 },
    { title: "FLOW MATCHING", subtitle: "Step 3: Particles FLOW together!", duration: 4500 },
    { title: "RESULT", subtitle: "Smooth trajectory generated AT ONCE", duration: 4000 },
    { title: "", subtitle: "", duration: 6000 }
];

let currentPhase = 0;
let phaseStartTime = Date.now();
let animationTime = 0;

function updatePhase() {
    const now = Date.now();
    const elapsed = now - phaseStartTime;

    if (elapsed > phases[currentPhase].duration) {
        currentPhase = (currentPhase + 1) % phases.length;
        phaseStartTime = now;

        if (currentPhase === 0) {
            noiseParticles.forEach(p => p.position.copy(p.userData.noisePos));
        }
    }

    const phase = currentPhase;
    const t = elapsed / phases[phase].duration;

    phaseTitle.textContent = phases[phase].title;
    phaseSubtitle.textContent = phases[phase].subtitle;

    // Input icons and arrows visibility
    inputGroup.visible = phase >= 1 && phase < 7;
    inputArrows.forEach(a => a.visible = phase >= 1 && phase < 7);
    inputLabels.style.opacity = phase >= 1 && phase < 7 ? '1' : '0';

    // Architecture elements
    vlmBox.visible = phase < 7;
    actionBox.visible = phase < 7;
    arrowGroup.visible = phase >= 1 && phase < 7;
    vlmLabel.style.opacity = phase < 7 ? '1' : '0';
    actionLabel.style.opacity = phase < 7 ? '1' : '0';

    // Phase 1: VLM highlighted with input animations
    if (phase === 1) {
        vlmMaterial.emissive.setHex(0x003344);
        vlmBox.scale.setScalar(1 + Math.sin(animationTime * 4) * 0.05);

        // Animate input icons
        cameraIcon.scale.setScalar(1 + Math.sin(animationTime * 5) * 0.1);
        textIcon.scale.setScalar(1 + Math.sin(animationTime * 5 + 1) * 0.1);
        stateIcon.rotation.z = animationTime * 2;
    } else {
        vlmMaterial.emissive.setHex(0x000000);
        vlmBox.scale.setScalar(1);
        cameraIcon.scale.setScalar(1);
        textIcon.scale.setScalar(1);
    }

    // Phase 2: Action Expert highlighted
    if (phase === 2) {
        actionMaterial.emissive.setHex(0x331111);
        actionBox.scale.setScalar(1 + Math.sin(animationTime * 4) * 0.05);
    } else {
        actionMaterial.emissive.setHex(0x000000);
        actionBox.scale.setScalar(1);
    }

    // Phase 3: NOISE
    if (phase === 3) {
        noiseParticles.forEach((p, i) => {
            p.visible = true;
            p.position.x = p.userData.noisePos.x + Math.sin(animationTime * 3 + i) * 0.15;
            p.position.y = p.userData.noisePos.y + Math.cos(animationTime * 2.5 + i * 0.5) * 0.15;
            p.material.color.setHex(noiseColor);
            p.material.emissive.setHex(noiseColor);
        });
        statusLabel.innerHTML = '<span style="color:#ff6b6b;">🎲 RANDOM NOISE</span>';
        velocityArrows.forEach(a => a.visible = false);
        trajectoryMesh.visible = false;
    }
    // Phase 4: VELOCITY FIELD
    else if (phase === 4) {
        velocityArrows.forEach((arrow, i) => {
            arrow.visible = true;
            arrow.userData.shaftMat.opacity = 0.7;
            arrow.userData.headMat.opacity = 0.7;
            const targetY = Math.sin((arrow.position.x - 4.5) / 4 * Math.PI * 2) * 1.2;
            arrow.rotation.z = Math.atan2(targetY - arrow.position.y, 1) - Math.PI / 2;
        });

        noiseParticles.forEach((p, i) => {
            p.visible = true;
            const moveT = Math.min(t * 0.3, 0.3);
            p.position.lerpVectors(p.userData.noisePos, p.userData.targetPos, moveT);
        });
        statusLabel.innerHTML = '<span style="color:#4ecdc4;">➜ VELOCITY FIELD</span>';
    }
    // Phase 5: FLOWING
    else if (phase === 5) {
        noiseParticles.forEach((p, i) => {
            p.visible = true;
            const flowT = 0.3 + t * 0.7;
            p.position.lerpVectors(p.userData.noisePos, p.userData.targetPos, flowT);
            p.material.color.setHex(smoothColor);
            p.material.emissive.setHex(smoothColor);
        });

        velocityArrows.forEach(arrow => {
            arrow.userData.shaftMat.opacity = 0.4 * (1 - t);
            arrow.userData.headMat.opacity = 0.4 * (1 - t);
        });
        statusLabel.innerHTML = '<span style="color:#00ff88;">↻ FLOWING...</span>';
    }
    // Phase 6: SMOOTH OUTPUT
    else if (phase === 6) {
        noiseParticles.forEach(p => {
            p.visible = true;
            p.position.copy(p.userData.targetPos);
            p.material.color.setHex(smoothColor);
        });

        trajectoryMat.opacity = t;
        trajectoryMesh.visible = true;
        velocityArrows.forEach(a => a.visible = false);
        statusLabel.innerHTML = '<span style="color:#00ff88;">✓ SMOOTH TRAJECTORY</span>';
    }
    // Phase 7: PUNCHLINE
    else if (phase === 7) {
        vlmBox.visible = false;
        actionBox.visible = false;
        arrowGroup.visible = false;
        inputGroup.visible = false;
        inputArrows.forEach(a => a.visible = false);
        trajectoryMesh.visible = false;
        noiseParticles.forEach(p => p.visible = false);
        velocityArrows.forEach(a => a.visible = false);
        vlmLabel.style.opacity = '0';
        actionLabel.style.opacity = '0';
        inputLabels.style.opacity = '0';
        statusLabel.innerHTML = '';
        punchline.style.opacity = '1';
    }
    // Early phases (phase 0)
    else if (phase === 0) {
        noiseParticles.forEach(p => p.visible = false);
        velocityArrows.forEach(a => a.visible = false);
        trajectoryMesh.visible = false;
        statusLabel.innerHTML = '';
        punchline.style.opacity = '0';
    }
}

function animate() {
    requestAnimationFrame(animate);
    animationTime += 0.016;
    updatePhase();
    renderer.render(scene, camera);
}

function resetAnimation() {
    currentPhase = 0;
    phaseStartTime = Date.now();
    animationTime = 0;
    noiseParticles.forEach(p => p.position.copy(p.userData.noisePos));
}

animate();

        // ============================================
        // END ILLUSTRATION CODE
        // ============================================

        // Reset View button - restore camera position
        const initialCameraPosition = {
            x: camera.position.x,
            y: camera.position.y,
            z: camera.position.z
        };

        document.getElementById('reset-view-btn').addEventListener('click', () => {
            camera.position.set(
                initialCameraPosition.x,
                initialCameraPosition.y,
                initialCameraPosition.z
            );
            camera.up.set(0, 1, 0);
            controls.target.set(0, 0, 0);
            controls.reset();
        });

        // Reset Animation button - restart from phase 1
        // Note: resetAnimation() function must be defined in the illustration code
        document.getElementById('reset-anim-btn').addEventListener('click', () => {
            if (typeof resetAnimation === 'function') {
                resetAnimation();
            } else {
                console.warn('resetAnimation() not defined in illustration code');
            }
        });

        // Window resize handler
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
    </script>
</body>
</html>
