<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <style>
      .title { font: bold 18px sans-serif; fill: #333; }
      .label { font: 14px sans-serif; fill: #333; }
      .label-small { font: 11px sans-serif; fill: #666; }
      .formula { font: italic 13px serif; fill: #333; }
      .box { stroke-width: 2; rx: 5; }
      .arrow { stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .highlighted { fill: #ff6b35; stroke: #cc4400; opacity: 1; }
      .faded { fill: #e0e0e0; stroke: #999; opacity: 0.5; }
      .neutral { fill: #f5f5f5; stroke: #666; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6b35"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" class="title">Scaled Dot-Product Attention: Focus on Query (Q)</text>
  <text x="300" y="50" text-anchor="middle" class="label-small">"What am I looking for?"</text>

  <!-- Input at top -->
  <rect x="250" y="70" width="100" height="35" class="box neutral"/>
  <text x="300" y="93" text-anchor="middle" class="label">Input X</text>

  <!-- Three branches - Linear layers -->
  <!-- Q branch (HIGHLIGHTED) -->
  <rect x="80" y="140" width="100" height="35" class="box highlighted"/>
  <text x="130" y="163" text-anchor="middle" class="label" style="fill: white; font-weight: bold;">Linear (W_Q)</text>

  <!-- K branch (faded) -->
  <rect x="250" y="140" width="100" height="35" class="box faded"/>
  <text x="300" y="163" text-anchor="middle" class="label" style="opacity: 0.5;">Linear (W_K)</text>

  <!-- V branch (faded) -->
  <rect x="420" y="140" width="100" height="35" class="box faded"/>
  <text x="470" y="163" text-anchor="middle" class="label" style="opacity: 0.5;">Linear (W_V)</text>

  <!-- Arrows from Input to Linear layers -->
  <path d="M 270 105 L 130 135" class="arrow" style="stroke: #ff6b35;" marker-end="url(#arrowhead-orange)"/>
  <path d="M 300 105 L 300 135" class="arrow" style="stroke: #999; opacity: 0.5;"/>
  <path d="M 330 105 L 470 135" class="arrow" style="stroke: #999; opacity: 0.5;"/>

  <!-- Q, K, V labels -->
  <rect x="100" y="200" width="60" height="40" class="box highlighted"/>
  <text x="130" y="227" text-anchor="middle" class="label" style="fill: white; font-weight: bold;">Q</text>

  <rect x="270" y="200" width="60" height="40" class="box faded"/>
  <text x="300" y="227" text-anchor="middle" class="label" style="opacity: 0.5;">K</text>

  <rect x="440" y="200" width="60" height="40" class="box faded"/>
  <text x="470" y="227" text-anchor="middle" class="label" style="opacity: 0.5;">V</text>

  <!-- Arrows from Linear to Q,K,V -->
  <path d="M 130 175 L 130 195" class="arrow" style="stroke: #ff6b35;" marker-end="url(#arrowhead-orange)"/>
  <path d="M 300 175 L 300 195" class="arrow" style="stroke: #999; opacity: 0.5;"/>
  <path d="M 470 175 L 470 195" class="arrow" style="stroke: #999; opacity: 0.5;"/>

  <!-- MatMul box (Q·K^T) -->
  <rect x="170" y="280" width="120" height="40" class="box faded"/>
  <text x="230" y="305" text-anchor="middle" class="label" style="opacity: 0.5;">MatMul (Q·K^T)</text>

  <!-- Arrows to MatMul -->
  <path d="M 130 240 L 190 275" class="arrow" style="stroke: #ff6b35;" marker-end="url(#arrowhead-orange)"/>
  <path d="M 300 240 L 260 275" class="arrow" style="stroke: #999; opacity: 0.5;"/>

  <!-- Scale box -->
  <rect x="170" y="340" width="120" height="35" class="box faded"/>
  <text x="230" y="363" text-anchor="middle" class="label" style="opacity: 0.5;">Scale (÷√d_k)</text>

  <path d="M 230 320 L 230 335" class="arrow" style="stroke: #999; opacity: 0.5;"/>

  <!-- Softmax -->
  <rect x="170" y="395" width="120" height="35" class="box faded"/>
  <text x="230" y="418" text-anchor="middle" class="label" style="opacity: 0.5;">Softmax</text>

  <path d="M 230 375 L 230 390" class="arrow" style="stroke: #999; opacity: 0.5;"/>

  <!-- Final MatMul with V -->
  <rect x="300" y="395" width="120" height="35" class="box faded"/>
  <text x="360" y="418" text-anchor="middle" class="label" style="opacity: 0.5;">MatMul</text>

  <path d="M 290 412 L 295 412" class="arrow" style="stroke: #999; opacity: 0.5;"/>
  <path d="M 470 240 L 470 395 L 425 395" class="arrow" style="stroke: #999; opacity: 0.5;"/>

  <!-- Output -->
  <rect x="300" y="450" width="120" height="35" class="box faded"/>
  <text x="360" y="473" text-anchor="middle" class="label" style="opacity: 0.5;">Output</text>

  <path d="M 360 430 L 360 445" class="arrow" style="stroke: #999; opacity: 0.5;"/>

  <!-- Legend -->
  <rect x="20" y="450" width="15" height="15" fill="#ff6b35"/>
  <text x="40" y="462" class="label-small">Query (Q): "What am I looking for?"</text>

</svg>